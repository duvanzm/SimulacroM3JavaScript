<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>RestorApp Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<!-- TOP NAV -->
<nav class="navbar navbar-expand-lg bg-white border-bottom px-4">
  <span class="navbar-brand fw-bold text-success">RestorApp Admin</span>

  <ul class="navbar-nav ms-auto gap-3 align-items-center">
    <li class="nav-item fw-semibold text-success">Dashboard</li>
    <li class="nav-item text-muted">Menu</li>
    <li class="nav-item text-muted">Users</li>

    <li class="nav-item">
      <button
        class="btn btn-outline-danger btn-sm"
        id="logoutBtn"
      >
        Logout
      </button>
    </li>
  </ul>
</nav>


<div class="container-fluid p-4">

  <!-- METRICS -->
  <div class="row g-3 mb-4">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <small class="text-muted">Total Orders</small>
          <h4 id="totalOrders">0</h4>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <small class="text-muted">Pending Orders</small>
          <h4 id="pendingOrders">0</h4>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <small class="text-muted">Today's Revenue</small>
          <h4>$<span id="todayRevenue">0</span></h4>
        </div>
      </div>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="row g-4">

    <!-- ORDERS LIST -->
    <div class="col-lg-8">
      <div class="card shadow-sm">
        <div class="card-header bg-white fw-semibold">
          Recent Orders
        </div>

        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>User</th>
                <th>Date</th>
                <th>Status</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="ordersTable"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ORDER DETAIL -->
    <div class="col-lg-4">
      <div class="card shadow-sm">
        <div class="card-header bg-white fw-semibold">
          Order Details
        </div>

        <div class="card-body" id="orderDetail">
          <p class="text-muted text-center mb-0">
            Selecciona una orden
          </p>
        </div>
      </div>
    </div>

  </div>

  <!-- PRODUCTS -->
  <div class="card shadow-sm mt-4">
    <div class="card-header bg-white fw-semibold">
      Product Management
    </div>

    <div class="card-body">
      <form id="productForm" class="row g-2 mb-3">
        <div class="col-md-4">
          <input type="text" id="name" class="form-control" placeholder="Nombre" required>
        </div>
        <div class="col-md-3">
          <input type="text" id="category" class="form-control" placeholder="Categoría" required>
        </div>
        <div class="col-md-3">
          <input type="number" id="price" class="form-control" placeholder="Precio" required>
        </div>
        <div class="col-md-2">
          <button class="btn btn-success w-100">Crear</button>
        </div>
      </form>

      <ul class="list-group" id="productList"></ul>
    </div>
  </div>

</div>

<script src="./api.js"></script>
<script src="./dashboard.js"></script>
<script src="./products.js"></script>

</body>
</html>
