<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <!-- Bootstrap@5.3.8 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <!-- Form sing in -->
            <form id="form-in" class="d-block">
                <div class="card p-5">
                    <div class="card-title text-center">
                        <img src="" alt="logo">
                        <h2>RestorApp</h2>
                        <span>Login to your account</span>
                    </div>
                    <div class="card-body">
                            <div class="mb-3">
                                <label for="" class="form-label">User</label>
                                <input type="text" name="user" class="form-control" placeholder="Jorge Ramires">
                            </div>
                            <div class="mb-3">
                                <label for="" class="form-label">Password</label>
                                <input type="password" name="password" class="form-control" placeholder="jorge@gmail.com">
                            </div>
                            <div class="mb-3">
                                <label for="" class="form-label">Select Role</label>
                                <select name="rol" id="" class="form-select">
                                    <option value="user">User</option>
                                    <option value="admin">Admin</option>
                                </select>
                            </div> 

                            <button type="submit" class="btn btn-success w-100 mt-5">sing In</button>
                            <span class="text-center">Don´t have an account? <a id="up" href="#" onclick="singUp()">Sing Up</a></span>
                            <div class="alert-acceso">

                            </div>
                    </div>
                </div>
            </form>
            <!-- Form sing up -->
            <form id="form-up" class="d-none">
                <div class="card p-5">
                    <div class="card-title text-center">
                        <img src="" alt="logo">
                        <h2>RestorApp</h2>
                        <span>Create your account</span>
                    </div>
                    <div class="card-body">
                            <div class="mb-3">
                                <label for="" class="form-label">Full name</label>
                                <input name="name" type="text" class="form-control" placeholder="Jorge Ramires">
                            </div>
                            <div class="mb-3">
                                <label for="" class="form-label">Email adress</label>
                                <input name="email" type="text" class="form-control" placeholder="jorge@gmail.com">
                            </div>
                            <div class="mb-3">
                                <label for="" class="form-label">User</label>
                                <input name="user" type="text" class="form-control" placeholder="jorge@">
                            </div>
                            <div class="mb-3">
                                <label for="" class="form-label">Password</label>
                                <input name="password" type="password" class="form-control" placeholder="*********">
                            </div>
                            <div class="mb-3">
                                <label for="" class="form-label">Select Role</label>
                                <select name="rol" id="" class="form-select">
                                    <option value="">User</option>
                                </select>
                            </div>

                            <button class="btn btn-success w-100 mt-5">Register</button>
                            <span class="text-center">Don´t have an account? <a id="in" href="#" onclick="singIn()">Sing In</a></span>
                            <div class="register"></div>
                    </div>
                </div>
            </form>
   
        </div>
    </div>
</div>
    <script type="module" src="app.js"></script>
</body>
</html>
